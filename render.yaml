services:
  - type: web
    name: smart-control-tower
    runtime: python
    buildCommand: ""
    startCommand: python ai_local_server.py
    plan: free
    envVars:
      - key: PYTHONUNBUFFERED
        value: "1"
      - key: SMART_TOWER_HOST
        value: "0.0.0.0"
      - key: GROQ_API_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: MISTRAL_API_KEY
        sync: false
